spring.application.name=product-service
server.port=8082
eureka.instance.prefer-ip-address=true
spring.data.web.pageable.serialization-mode=via-dto
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://mongo:27017/database}

#Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
spring.security.user.name=eureka
spring.security.user.password=password

# Redis Configuration
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.data.redis.timeout=60000

# ======= Kafka Consumer =======
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka-1:9090,kafka-2:9090,kafka-3:9090}

# Group ID: tất cả instance của product-service cùng group → chỉ 1 instance xử lý mỗi message
spring.kafka.consumer.group-id=product-service-group

# Bắt đầu đọc từ đầu topic nếu chưa có offset (lần đầu deploy)
spring.kafka.consumer.auto-offset-reset=earliest

# Deserializer mặc định (bị override bởi KafkaConsumerConfig bean)
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# ======= Actuator + Prometheus =======
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true

# ======= Tracing (Zipkin + Spring Cloud Sleuth) =======
management.tracing.sampling.probability=1.0
management.zipkin.tracing.export.enabled=true
management.zipkin.tracing.endpoint=${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
